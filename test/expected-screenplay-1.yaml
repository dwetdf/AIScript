# ============================================================
acts:
  # ======== 第一幕 ========
  - act_number: 1
    act_title: "第一幕 相逢"
    act_type: "setup"
    synopsis: "火车上'我'遇见棋呆子王一生。"
    scenes:
      - scene_number: 1
        scene_global_number: 1
        location:
          location_id: "train_carriage"
          name: "火车车厢"
          interior_exterior: "INT"
          set_description: "1970年代绿皮火车知青专列车厢，拥挤嘈杂，标语褪色"
        time_of_day: "日"
        scene_heading: "INT. 火车车厢 — 日"
        scene_heading_override: false
        source_chapter_ref: "第一章"
        synopsis: "'我'登上知青专列，遇见精瘦的王一生。王一生问'下棋吗'，两人初次交流。"
        dramatic_function: "exposition"
        tension_level: 2
        characters_present:
          - "wang_yi_sheng"
          - "wo"
        estimated_duration_seconds: 195
        beats:
          # ----- B1: 建立环境 -----
          - beat_id: "E1A1S1B1"
            beat_type: "action"
            action_text: "车站月台上，成千上万的人在送别。临时挂起的红布标语褪了色，字纸折得有些坏。喇叭里放着语录歌。"
            emotion: "嘈杂、混乱"
            estimated_duration_seconds: 15
            source_ref:
              chapter: 1
              paragraph: 1
              excerpt: "车站是乱得不能再乱。红布标语大约挂了不少次。"
            is_ai_generated: false

          # ----- B2: 主角入场 -----
          - beat_id: "E1A1S1B2"
            beat_type: "action"
            action_text: "'我'独自挤进车厢，没人送。扫了一圈——窗边坐满了说笑哭泣的知青。阳光斜射进来，冷清清地照在北边儿众多的屁股上。"
            emotion: "孤独"
            estimated_duration_seconds: 12
            source_ref:
              chapter: 1
              paragraph: 2
              excerpt: "我没来人送。冬日的阳光斜射进来，冷清清地照在北边儿众多的屁股上。"
            is_ai_generated: false

          # ----- B3: 发现王一生 -----
          - beat_id: "E1A1S1B3"
            beat_type: "action"
            action_text: "'我'找座位的目光停下来——角落座位上，一个精瘦的学生独自坐着。手拢在袖管里，望着窗外空车皮出神。周围一切都与他无关。"
            emotion: "好奇心"
            estimated_duration_seconds: 10
            source_ref:
              chapter: 1
              paragraph: 3
              excerpt: "还有一个精瘦的学生孤坐着，手拢在袖管里，隔窗望着车站南边儿的空车皮。"
            is_ai_generated: false

          # ----- B4: "下棋吗？" ——第一句台词 -----
          - beat_id: "E1A1S1B4"
            beat_type: "action"
            action_text: "'我'在他斜对面坐下。学生收回目光，瞄了'我'的手一眼。"
            estimated_duration_seconds: 5
            is_ai_generated: true

          - beat_id: "E1A1S1B5"
            beat_type: "action"
            action_text: "他的眼睛里突然放出光来。"
            estimated_duration_seconds: 3
            source_ref:
              chapter: 1
              paragraph: 4
              excerpt: "眼裡突然放出光來"
            is_ai_generated: false

          - beat_id: "E1A1S1B6"
            beat_type: "dialogue"
            character_id: "wang_yi_sheng"
            character_name_display: "王一生"
            dialogue_text: "下棋吗？"
            emotion: "热切期待"
            estimated_duration_seconds: 3
            source_ref:
              chapter: 1
              paragraph: 4
              excerpt: "「下棋嗎？」"
            is_ai_generated: false

          - beat_id: "E1A1S1B7"
            beat_type: "parenthetical"
            character_id: "wo"
            character_name_display: "我"
            parenthetical_text: "（吓了一跳）"
            estimated_duration_seconds: 1
            is_ai_generated: true

          - beat_id: "E1A1S1B8"
            beat_type: "dialogue"
            character_id: "wo"
            character_name_display: "我"
            dialogue_text: "不会。"
            emotion: "防御性"
            estimated_duration_seconds: 2
            source_ref:
              chapter: 1
              paragraph: 4
              excerpt: "急忙擺手說：「不會！」"
            is_ai_generated: false

          # ... (更多beats省略)
        continuity_notes: "（暂无）"

  # ======== 第三幕 • 高潮场景 ========
  - act_number: 3
    act_title: "第三幕 九连环"
    act_type: "resolution"
    synopsis: "王一生一人对九人下盲棋。"
    scenes:
      - scene_number: 4
        scene_global_number: 10
        location:
          location_id: "chess_venue"
          name: "地区棋场"
          interior_exterior: "INT_EXT"
          set_description: "空荡的大屋子，八张大白纸挂墙上画了棋盘格。屋外上千人。"
        time_of_day: "日（持续至天黑）"
        scene_heading: "INT/EXT. 地区棋场 — 日"
        scene_heading_override: false
        source_chapter_ref: "第四章"
        synopsis: "九人盲棋车轮大战。千人围观。高潮——冠军老者求和，王一生赛后嚎啕。"
        dramatic_function: "climax"
        tension_level: 5
        characters_present:
          - "wang_yi_sheng"
          - "wo"
          - "ni_bin"
        estimated_duration_seconds: 900   # 约15分钟
        beats:
          # ----- B1: 人群涌向棋场 -----
          - beat_id: "E1A3S10B1"
            beat_type: "action"
            action_text: "街上。百十人拥着王一生一群人向棋场走去。走過半條街，竟有上千人跟着。行人紛紛問——是不是知青打架？"
            emotion: "骚动、兴奋"
            estimated_duration_seconds: 18
            source_ref:
              chapter: 4
              paragraph: 3
              excerpt: "走到街上，百十人走成一片。走過半條街，竟有上千人跟著跑來跑去。"
            is_ai_generated: false

          # ----- B2-B4: 挂棋盘、准备 -----
          - beat_id: "E1A3S10B2"
            beat_type: "action"
            action_text: "棋场外，志愿人员用硬纸剪了百十个棋子，红黑两色，背后粘细绳，挂在八张大白纸画的棋盘格上。风一吹，棋子轻轻晃成一片。"
            estimated_duration_seconds: 10
            source_ref:
              chapter: 4
              paragraph: 5
              excerpt: "有人拿來八張整開白紙，很快地畫了格兒。又有人用硬紙剪了百十個方棋子兒，粘細繩，掛在棋格兒的釘子上。"
            is_ai_generated: false

          - beat_id: "E1A3S10B3"
            beat_type: "action"
            action_text: "人是越來越多。後面的人拼命向前擠。婦女抱孩子遠遠圍成一片。半大孩子們鑽來鑽去。數千人鬧鬧嚷嚷，街上像半空響著悶雷。"
            estimated_duration_seconds: 12
            source_ref:
              chapter: 4
              paragraph: 6
              excerpt: "人是越來越多。數千人鬧鬧嚷嚷，街上像半空響著悶雷。"
            is_ai_generated: false

          # ----- B5: 王一生入座 -----
          - beat_id: "E1A3S10B4"
            beat_type: "action"
            action_text: "王一生被引到棋场中央——唯一一把靠背椅。他坐下，把手放在兩條腿上。一頭一臉都是土，像是被傳訊的歹人。"
            estimated_duration_seconds: 8
            source_ref:
              chapter: 4
              paragraph: 8
              excerpt: "王一生坐在場當中一個靠背椅上，把手放在兩條腿上，眼睛虛望著。"
            is_ai_generated: false

          - beat_id: "E1A3S10B5"
            beat_type: "action"
            action_text: "'我'过去给他拍一拍土。他按住'我'的手——抖。"
            estimated_duration_seconds: 6
            source_ref:
              chapter: 4
              paragraph: 8
              excerpt: "我過去給他拍一拍土。他按住我的手，我覺出他有些抖。"
            is_ai_generated: false

          - beat_id: "E1A3S10B6"
            beat_type: "dialogue"
            character_id: "wang_yi_sheng"
            character_name_display: "王一生"
            dialogue_text: "事情闹大了。你们几个朋友看好，一有动静，一起跑。"
            emotion: "低声、紧张"
            estimated_duration_seconds: 5
            source_ref:
              chapter: 4
              paragraph: 8
              excerpt: "事情鬧大了。你們幾個朋友看好，一有動靜，一起跑。"
            is_ai_generated: false

          - beat_id: "E1A3S10B7"
            beat_type: "dialogue"
            character_id: "wang_yi_sheng"
            character_name_display: "王一生"
            dialogue_text: "怕江湖的不怕朝廷的。书包你拿着。不管怎么样，书包不能丢。书包里有——我妈的无字棋。"
            emotion: "郑重"
            estimated_duration_seconds: 8
            source_ref:
              chapter: 4
              paragraph: 8
              excerpt: "怕江湖的不怕朝廷的。书包装着——我妈的无字棋。"
            is_ai_generated: false
            editorial_note: "这句台词总结了他的全部哲学和情感。怕江湖——因为真正的棋在民间。无字棋——母亲留下的唯一东西。把书包交给'我'——是信任。"

          # ----- B8: 盲棋开始——静谧 vs 骚动 -----
          - beat_id: "E1A3S10B8"
            beat_type: "action"
            action_text: "棋開始了。上千人不再出聲。王一生一个人空空地在场中央，谁也不看。静静得像一块铁。"
            estimated_duration_seconds: 6
            source_ref:
              chapter: 4
              paragraph: 10
              excerpt: "棋開始了。上千人不再出聲兒。他一個人空空地在場中央。靜靜的像一塊鐵。"
            is_ai_generated: false

          - beat_id: "E1A3S10B9"
            beat_type: "action"
            action_text: "只有風吹得八張大紙嘩嘩響。棋子兒蕩來蕩去。前幾十排的人都坐下了。一個個土眉土眼，頭髮長長短短吹得飄。再沒人動一下——似乎都把命放在棋裡搏。"
            estimated_duration_seconds: 10
            source_ref:
              chapter: 4
              paragraph: 10
              excerpt: "風吹得八張大紙嘩嘩地響。似乎都把命放在棋裡搏。"
            is_ai_generated: false

          # ----- B10: '我'的内省时刻 -----
          - beat_id: "E1A3S10B10"
            beat_type: "action"
            action_text: "'我'伸手到王一生书包裹里去掏摸——捏到一个小布包。拽出来：旧蓝斜纹布小口袋。上面绣了一只蝙蝠，四边用线做了圈口。取出一个棋子——很小，在太阳底下竟是半透明的，像一隻眼睛，正柔和地瞧着。"
            estimated_duration_seconds: 12
            source_ref:
              chapter: 4
              paragraph: 14
              excerpt: "捏到一個小布包兒。取出一個棋子，確實很小，在太陽底下竟是半透明的，像是一隻眼睛。"
            is_ai_generated: false

          # ... (中间省略大量 beats——蒙太奇、对手淘汰、太阳落下) ...

          # ----- B25: 冠军老者出场 -----
          - beat_id: "E1A3S10B25"
            beat_type: "action"
            action_text: "忽然人群乱起来，纷纷闪开。一个老者，精光头皮，由旁人搀着慢慢走出来。他嘴嚼动着，上上下下看着八张残局。"
            emotion: "权威、庄严"
            estimated_duration_seconds: 12
            source_ref:
              chapter: 4
              paragraph: 22
              excerpt: "忽然人群亂起來，紛紛閃開。只見一老者，精光頭皮，由旁人攙著，慢慢走出來。"
            is_ai_generated: false
            camera_suggestion: "slow motion, 老者从人群中走出的背影。人群缓缓分开。时间感变慢。"

          - beat_id: "E1A3S10B26"
            beat_type: "action"
            action_text: "老者看完了棋，轻轻抻一抻衣衫，跺一跺土，昂了头，由人搀进棋场。"
            estimated_duration_seconds: 8
            source_ref:
              chapter: 4
              paragraph: 22
              excerpt: "老者看完了棋，輕輕抻一抻衣衫，跺一跺土，昂了頭，由人攙進棋場。"
            is_ai_generated: false

          # ----- B27: 王一生——入定雕像 -----
          - beat_id: "E1A3S10B27"
            beat_type: "action"
            action_text: "王一生孤身一人坐在大屋子中央。瞪眼看着众人。双手支在膝上——铁铸一个细树桩。似无所见，似无所闻。电灯暗照在他脸上。眼睛深陷进去，黑黑的似俯视大千世界。"
            emotion: "神圣、超然"
            estimated_duration_seconds: 10
            source_ref:
              chapter: 4
              paragraph: 24
              excerpt: "王一生孤身一人坐在大屋子中央。鐵鑄一個細樹椿。眼睛深陷進去，黑黑的似俯視大千世界。"
            is_ai_generated: false
            music_cue: "音乐应该在这里完全静默。只听到风声和微弱的电灯嗡嗡声。"

          # ----- B28: 老者的赞誉 -----
          - beat_id: "E1A3S10B28"
            beat_type: "dialogue"
            character_id: "museum_guan_jun"
            character_name_display: "冠军老者"
            dialogue_text: "后生。老朽身有不便，不能亲赴沙场。命人传棋，实出无奈。你小小年纪，就有这般棋道。汇道禅于一炉，神机妙算，先声有势，后发制人，遣龙治水，气贯阴阳。古今儒将，不过如此。"
            estimated_duration_seconds: 18
            source_ref:
              chapter: 4
              paragraph: 28
              excerpt: "後生，老朽身有不便，不能親赴沙場。匯道禪於一爐，神機妙算。"
            is_ai_generated: false

          - beat_id: "E1A3S10B29"
            beat_type: "dialogue"
            character_id: "museum_guan_jun"
            character_name_display: "冠军老者"
            dialogue_text: "老朽有幸与你接手，感触不少。中华棋道，毕竟不颓。愿与你做个忘年之交。这盘棋下到这里，权做赏玩——不知你可愿意平手言和，给老朽一点面子？"
            estimated_duration_seconds: 12
            source_ref:
              chapter: 4
              paragraph: 28
              excerpt: "願與你做個忘年之交。不知你可願意平手言和，給老朽一點面子？"
            is_ai_generated: false

          # ----- B30: "和了吧" -----
          - beat_id: "E1A3S10B30"
            beat_type: "action"
            action_text: "王一生挣了一下，起不来。'我'和脚卵急忙过去，托住他的腋下提他起来。他的腿仍是坐着的姿势，直不了——半空悬着。"
            estimated_duration_seconds: 8
            source_ref:
              chapter: 4
              paragraph: 29
              excerpt: "王一生再掙了一下，仍起不來。他的腿仍是坐著的樣子，直不了，半空懸著。"
            is_ai_generated: false

          - beat_id: "E1A3S10B31"
            beat_type: "action"
            action_text: "脚卵用大手在王一生身上、脸上、脖子上缓缓用力揉。半晌，身子软下来。喉咙嘶嘶地响。慢慢把嘴张开，又合上，再张开。"
            estimated_duration_seconds: 8
            is_ai_generated: true

          - beat_id: "E1A3S10B32"
            beat_type: "dialogue"
            character_id: "wang_yi_sheng"
            character_name_display: "王一生"
            dialogue_text: "和了吧。"
            emotion: "力竭、艰难"
            estimated_duration_seconds: 3
            source_ref:
              chapter: 4
              paragraph: 29
              excerpt: "很久，才嗚嗚地說：「和了吧。」"
            is_ai_generated: false
            editorial_note: "两个字。全片最长的一场戏以'和了吧'三个字收尾——竞技的终点不是胜负，是和解。"

          # ----- B33-B36: 母亲——情感释放 -----
          - beat_id: "E1A3S10B33"
            beat_type: "flashback_start"
            flashback_label: "母亲"
            music_cue: ""
            estimated_duration_seconds: 2
            is_ai_generated: true

          - beat_id: "E1A3S10B34"
            beat_type: "action"
            action_text: "闪回：昏暗的房间里。母亲用一双弱手一张一张地折书页。然后拿起牙刷把——在石头上磨。一下，一下。磨成小小的圆子儿。"
