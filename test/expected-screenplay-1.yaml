  adaptation_decisions:
    - decision: "将捡烂纸老头的故事改为闪回段落"
      rationale: "影视化需要视觉呈现。老头的棋道哲学（太盛则折、以柔化之）是整个故事的核心支撑。"
    - decision: "删减原著中关于吃的冗长描述"
      rationale: "保留三处关键吃相（火车上、蛇肉宴、赛后吃饭），其余压缩。电影需要用画面代替文字的细节。"
    - decision: "'我'的内心活动部分使用VO"
      rationale: "结尾的VO是全片唯一一次——'衣食是本，囿在其中终于不太像人'。之前的内心活动都通过反应镜头传达。"
