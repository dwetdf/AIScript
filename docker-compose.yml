version: "3.8"

services:
  aiscript:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiscript:latest
    container_name: aiscript
    ports:
      - "${AISCRIPT_PORT:-5000}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
